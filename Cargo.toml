[package]
name = "kernel-callback-studies"
version = "0.1.0"
edition = "2021"
authors = ["mscupcakegkill-hue"]
description = "Experimental implementation of Windows Kernel-mode callbacks using Rust"

[lib]
crate-type = ["cdylib"]

[dependencies]
wdk-sys = "0.3.0"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
strip = true
